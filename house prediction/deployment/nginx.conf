# Nginx Reverse Proxy Configuration for House Price Prediction
# Place in: /etc/nginx/conf.d/house-price-prediction.conf (Amazon Linux 2023)
# or /etc/nginx/sites-available/house-price-prediction (Ubuntu)

upstream flask_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your EC2 Public IPv4 or registered domain name (e.g., houseprice.example.com)
    server_name _;

    # Maximum allowed client request body size
    client_max_body_size 5M;

    # Gzip compression for optimal static asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Direct static file serving via Nginx (faster than routing through Gunicorn/Python)
    location /static/ {
        alias /var/www/house-price-prediction/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy all dynamic requests to Gunicorn WSGI server
    location / {
        proxy_pass http://flask_app;
        proxy_redirect off;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint for AWS Application Load Balancers (ALB)
    location /health {
        proxy_pass http://flask_app/health;
        proxy_set_header Host $http_host;
        access_log off;
    }
}
